<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>ETMM의 한국어 교실</title>
<style>
:root{--bg:#f6f5f1;--sf:#fff;--tx:#1d1d1f;--mu:#6b6a70;--bd:#e0ded8;--ac:#4a5cf0}
@media (prefers-color-scheme:dark){:root{--bg:#17171a;--sf:#222226;--tx:#f0efe9;--mu:#9a98a0;--bd:#38383e;--ac:#8196ff}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px)}
.card{width:100%;max-width:340px;background:var(--sf);border:1px solid var(--bd);border-radius:18px;padding:24px}
h1{font-size:18px;margin:0 0 16px;text-align:center}
#pw{display:block;width:100%;font-size:17px;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
label{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mu);margin:12px 2px}
button{width:100%;font-size:16px;font-weight:700;padding:12px;border:0;border-radius:12px;background:var(--ac);color:#fff;cursor:pointer}
button:disabled{opacity:.6}
#msg{min-height:20px;margin-top:10px;font-size:13px;color:#d9534f;text-align:center;word-break:break-word}
[hidden]{display:none!important}
</style>
</head>
<body>
<main id="m" hidden>
  <div class="card">
    <h1>🔒 請輸入密碼</h1>
    <form id="f">
      <input id="pw" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="密碼">
      <label><input id="sp" type="checkbox">顯示密碼</label>
      <label><input id="rm" type="checkbox" checked>記住這台裝置</label>
      <button id="go" type="submit">解鎖</button>
      <div id="msg" role="alert"></div>
    </form>
  </div>
</main>

var KEY="kr-lock-key-v1";
function b64d(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function b64e(u){var s="";for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)}
function show(html){document.open();document.write(html);document.close()}
function msg(t){document.getElementById("msg").textContent=t}
async function decryptWith(key){
  var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64d(D.v)},key,b64d(D.c));
  return new TextDecoder().decode(pt);
}
async function deriveKey(pw){
  var base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64d(D.s),iterations:D.i,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,["decrypt"]);
}
async function tryRemembered(){
  var raw=null;try{raw=localStorage.getItem(KEY)}catch(e){}
  if(!raw)return false;
  try{
    var key=await crypto.subtle.importKey("raw",b64d(raw),"AES-GCM",false,["decrypt"]);
    var html=await decryptWith(key);
    try{sessionStorage.setItem("kr-lock-sk",raw)}catch(e){}
    show(html);return true;
  }catch(e){try{localStorage.removeItem(KEY)}catch(x){}return false}
}
async function main(){
  if(!window.crypto||!crypto.subtle){document.getElementById("m").hidden=false;msg("這個瀏覽器不支援解鎖，請用 https 網址開啟。");return}
  if(await tryRemembered())return;
  document.getElementById("m").hidden=false;
  var f=document.getElementById("f"),go=document.getElementById("go"),pw=document.getElementById("pw");
  pw.focus();
  document.getElementById("sp").onchange=function(){pw.type=this.checked?"text":"password"};
  f.onsubmit=async function(e){
    e.preventDefault();if(!pw.value)return;
    go.disabled=true;msg("解鎖中，請稍等幾秒…");
    var cands=[pw.value],tr=pw.value.trim();if(tr&&tr!==pw.value)cands.push(tr);
    var key=null,html=null,derr=null;
    for(var i=0;i<cands.length;i++){
      try{key=await deriveKey(cands[i]);html=await decryptWith(key);break}
      catch(err){derr=err;key=null;html=null}
    }
    if(html===null){
      msg(derr&&derr.name==="OperationError"?"密碼不正確，可以勾選「顯示密碼」檢查有沒有打錯。":"解鎖失敗："+(derr?derr.name+" "+derr.message:"未知錯誤"));
      go.disabled=false;return;
    }
    var rawKey=b64e(new Uint8Array(await crypto.subtle.exportKey("raw",key)));
    try{sessionStorage.setItem("kr-lock-sk",rawKey)}catch(x){}
    if(document.getElementById("rm").checked){try{localStorage.setItem(KEY,rawKey)}catch(x){}}
    try{show(html)}catch(err){msg("顯示失敗："+err.name+" "+err.message);go.disabled=false}
  };
}
main();
})();
